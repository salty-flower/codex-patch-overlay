status = "carried"
risk = "medium"
owner = "local"
notes = "Add `[tui].reasoning_display` with `status-only` (default), `persistent`, and `hidden` modes. Persistent mode renders received reasoning summaries while they stream and commits each completed item to the transcript, preserving summaries across later tool and assistant activity. Summary cells use width-aware Markdown wrapping, retain explicit newlines, and break overlong unspaced text instead of clipping it. This displays model-provided summaries only; raw reasoning remains controlled by `show_raw_agent_reasoning`."
