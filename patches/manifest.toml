[[patches]]
name = "token-usage-breakdown"
enabled = true
file = "patches/token-usage-breakdown.patch"
upstream_base = "rust-v0.148.0"
upstream_sha = "3ba0f711642a888aec92a611a3f3b2211157ff89"
source_hash = "sha256-Au61OzWJgYoQFHjV6LHCXTVfwN5AF3+MjdN5FLYhLYI="
cargo_hash = "sha256-MswemCvyG7uju6QrGKsZoD4S1GUhB8fP38o0R0mPa2M="
upstream_issue = "https://github.com/openai/codex/issues/13222"
status = "carried"
risk = "low"
owner = "local"
notes = "Add a 'Context input' row to the TUI /status display showing non-cached vs cached input tokens with a cached percentage. Helps users identify how much of their context window is consumed by fresh (paid) vs cached (free/cheap) tokens. Carries the 15 upstream `/status` snapshots the new row changes, and narrows `status_card_token_usage_excludes_cached_tokens` to the 'Token usage' total while asserting the new breakdown row. Snapshots keep upstream's `v0.0.0` version line, so the only remaining `codex-tui` snapshot failures are the version-string ones every release-tag checkout has. Verify by running /status in a session with conversation history; the new row appears below 'Context window' when cached tokens are present."

[[patches]]
name = "plan-mode-default"
enabled = true
file = "patches/plan-mode-default.patch"
upstream_base = "rust-v0.148.0"
upstream_sha = "3ba0f711642a888aec92a611a3f3b2211157ff89"
source_hash = "sha256-Au61OzWJgYoQFHjV6LHCXTVfwN5AF3+MjdN5FLYhLYI="
cargo_hash = "sha256-MswemCvyG7uju6QrGKsZoD4S1GUhB8fP38o0R0mPa2M="
upstream_issue = "https://github.com/openai/codex/issues/13942"
status = "carried"
risk = "low"
owner = "local"
notes = "Add `tui.default_collaboration_mode = \"plan\"` config option to launch the TUI in Plan mode instead of Code mode. Falls back to default on invalid values. Verify with `codex -c 'tui.default_collaboration_mode=\"plan\"' --no-alt-screen`; the TUI should start in Plan mode."

[[patches]]
name = "timed-queue"
enabled = true
file = "patches/timed-queue.patch"
upstream_base = "rust-v0.148.0"
upstream_sha = "3ba0f711642a888aec92a611a3f3b2211157ff89"
source_hash = "sha256-Au61OzWJgYoQFHjV6LHCXTVfwN5AF3+MjdN5FLYhLYI="
cargo_hash = "sha256-MswemCvyG7uju6QrGKsZoD4S1GUhB8fP38o0R0mPa2M="
upstream_issue = "local-request"
status = "carried"
risk = "medium"
owner = "local"
notes = "Add `/later <delay> <prompt>` to queue a follow-up prompt for a strict future time. The time spec accepts a relative delay (`10m`, `1h30m`, `90s`, bare number = minutes), a clock time `HH:MM[:SS]` (today, or tomorrow if already past), or an absolute `YYYY-MM-DD HH:MM[:SS]`. Due prompts drain immediately when idle, or wait for the current turn to finish if Codex is still running. The pending-input preview shows both the target wall-clock time (HH:MM:SS) and a live countdown refreshed every 10 seconds. Carries the default command-popup snapshot so the new `/later` entry does not fail `just test -p codex-tui`."

[[patches]]
name = "auto-thread-name"
enabled = true
file = "patches/auto-thread-name.patch"
upstream_base = "rust-v0.148.0"
upstream_sha = "3ba0f711642a888aec92a611a3f3b2211157ff89"
source_hash = "sha256-Au61OzWJgYoQFHjV6LHCXTVfwN5AF3+MjdN5FLYhLYI="
cargo_hash = "sha256-MswemCvyG7uju6QrGKsZoD4S1GUhB8fP38o0R0mPa2M="
upstream_issue = "local-request"
status = "carried"
risk = "medium"
owner = "local"
notes = "Add opt-in `[tui].auto_thread_name` with a clamped `auto_thread_name_after_turns` threshold (default 3). The active app-server generates a concise hidden title from loaded history, preserves existing names, skips subagents, and immediately refreshes the TUI thread title surfaces without adding a visible turn. Also adds a current-thread-scoped, model-callable `set_thread_name` tool (gated by the same opt-in, primary threads only): it emits `EventMsg::ThreadNameUpdateRequested`, and the owning app-server persists through the canonical thread-store metadata path and broadcasts one `thread/name/updated` (source=generated) to every initialized client, so a Stop-hook continuation can rename the live thread in-process without a second app-server. The generate and tool paths share one persistence writer (`persist_thread_name_if_unnamed`)."

[[patches]]
name = "tui-status-line-command"
enabled = true
file = "patches/tui-status-line-command.patch"
upstream_base = "rust-v0.148.0"
upstream_sha = "3ba0f711642a888aec92a611a3f3b2211157ff89"
source_hash = "sha256-Au61OzWJgYoQFHjV6LHCXTVfwN5AF3+MjdN5FLYhLYI="
cargo_hash = "sha256-MswemCvyG7uju6QrGKsZoD4S1GUhB8fP38o0R0mPa2M="
upstream_issue = "https://github.com/openai/codex/issues/17827"
status = "carried"
risk = "high"
owner = "local"
notes = "Add opt-in `[tui.status_line_command]` direct-argv rendering with a versioned JSON stdin contract, COLUMNS/LINES, single-flight coalescing, bounded timeout/output, built-in fallback before first success, retained same-thread last success after later failures, SGR-only ANSI parsing, and a maximum of two safely clipped passive footer rows. Periodic refresh deadlines survive unrelated immediate redraws, and current input usage is split into non-cached and cache-read tokens. Snapshot `approval_mode` mirrors the built-in approval-mode item so the on-request reviewer toggle is distinguishable (approve-for-me / ask-for-approval). A first valid terminal resize retries once after the constructor's zero-sized startup refresh, while identical resize notifications remain single-flight."

[[patches]]
name = "editable-enter-queue"
enabled = true
file = "patches/editable-enter-queue.patch"
upstream_base = "rust-v0.148.0"
upstream_sha = "3ba0f711642a888aec92a611a3f3b2211157ff89"
source_hash = "sha256-Au61OzWJgYoQFHjV6LHCXTVfwN5AF3+MjdN5FLYhLYI="
cargo_hash = "sha256-MswemCvyG7uju6QrGKsZoD4S1GUhB8fP38o0R0mPa2M="
upstream_issue = "local-request"
status = "carried"
risk = "medium"
owner = "local"
notes = "When a turn is running, normal Enter submissions now join the same editable follow-up queue as Tab instead of becoming active-turn steers immediately; the latest queued message can be recalled with the existing queued-message edit shortcut until it is actually dispatched. `!` shell escapes keep their immediate execution behavior. Also restores test-only Instant-style comparisons for FrameSchedule after guaranteed redraw scheduling changed the test channel payload."
