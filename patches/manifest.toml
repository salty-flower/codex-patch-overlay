upstream_issue = "https://github.com/openai/codex/issues/8784"
upstream_pr = "https://github.com/openai/codex/pull/27476"
status = "retired"
risk = "low"
owner = "local"
notes = "Retired for rust-v0.140.0: upstream added app-server `thread/delete` in openai/codex#25018 and CLI/TUI delete-session commands in openai/codex#27476."

[[patches]]
name = "disable-autocompact"
enabled = false
file = "patches/disable-autocompact.patch"
upstream_base = "rust-v0.142.0"
upstream_sha = "3a76f3ac68c8949d1cac6ea769b6ec7b8953a415"
source_hash = "sha256-F8wlv0vSuljNFDgIzoeuVxvD0dk90z2FBtpBTMih7AA="
cargo_hash = "sha256-fvEFNE12J6zaLZrN6oQB8X+jXoKPSCWrL17Sl28+7/c="
upstream_issue = "https://github.com/openai/codex/issues/4106"
status = "retired"
risk = "low"
owner = "local"
notes = "Retired for rust-v0.142.0: upstream exposes stable `[features] auto_compaction = false`, which disables pre-turn and mid-turn automatic context compaction."

[[patches]]
name = "token-usage-breakdown"
enabled = true
file = "patches/token-usage-breakdown.patch"
upstream_base = "rust-v0.144.3"
upstream_sha = "78ad6e6bfd1d3b6a209acd3ef82172a96b25179c"
source_hash = "sha256-TtOzSLByGf+8K5fs0b92wJ4e9tBZvFbJqfMtvSuGU58="
cargo_hash = "sha256-S4dsZXfmKvJItL2XYKyxfhqdCMATEG6oPjrtVRwkuYc="
upstream_issue = "https://github.com/openai/codex/issues/13222"
status = "carried"
risk = "low"
owner = "local"
notes = "Add a 'Context input' row to the TUI /status display showing non-cached vs cached input tokens with a cached percentage. Helps users identify how much of their context window is consumed by fresh (paid) vs cached (free/cheap) tokens. Verify by running /status in a session with conversation history; the new row appears below 'Context window' when cached tokens are present."

[[patches]]
name = "plan-mode-default"
enabled = true
file = "patches/plan-mode-default.patch"
upstream_base = "rust-v0.144.3"
upstream_sha = "78ad6e6bfd1d3b6a209acd3ef82172a96b25179c"
source_hash = "sha256-TtOzSLByGf+8K5fs0b92wJ4e9tBZvFbJqfMtvSuGU58="
cargo_hash = "sha256-S4dsZXfmKvJItL2XYKyxfhqdCMATEG6oPjrtVRwkuYc="
upstream_issue = "https://github.com/openai/codex/issues/13942"
status = "carried"
risk = "low"
owner = "local"
notes = "Add `tui.default_collaboration_mode = \"plan\"` config option to launch the TUI in Plan mode instead of Code mode. Falls back to default on invalid values. Verify with `codex -c 'tui.default_collaboration_mode=\"plan\"' --no-alt-screen`; the TUI should start in Plan mode."

[[patches]]
name = "timed-queue"
enabled = true
file = "patches/timed-queue.patch"
upstream_base = "rust-v0.144.3"
upstream_sha = "78ad6e6bfd1d3b6a209acd3ef82172a96b25179c"
source_hash = "sha256-TtOzSLByGf+8K5fs0b92wJ4e9tBZvFbJqfMtvSuGU58="
cargo_hash = "sha256-S4dsZXfmKvJItL2XYKyxfhqdCMATEG6oPjrtVRwkuYc="
upstream_issue = "local-request"
status = "carried"
risk = "medium"
owner = "local"
notes = "Add `/later <delay> <prompt>` to queue a follow-up prompt for a strict future time. The time spec accepts a relative delay (`10m`, `1h30m`, `90s`, bare number = minutes), a clock time `HH:MM[:SS]` (today, or tomorrow if already past), or an absolute `YYYY-MM-DD HH:MM[:SS]`. Due prompts drain immediately when idle, or wait for the current turn to finish if Codex is still running. The pending-input preview shows both the target wall-clock time (HH:MM:SS) and a live countdown refreshed every 10 seconds."
