[release]
patch_suffix = "patch.2"
upstream_repo = "openai/codex"
upstream_package = "codex"

# One entry per carried or candidate patch.
# Disabled entries document candidates without affecting the build.

[[patches]]
name = "tui-notification-sound"
enabled = true
file = "patches/tui-notification-sound.patch"
upstream_base = "rust-v0.157.0"
upstream_sha = "00c972ed5d6ff6499317fd41b7f23605b8e6850d"
source_hash = "sha256-/f/k77vnFjPfnnf+X2E7rY2FxUR1xAcJZiPTv9Q8JVI="
cargo_hash = "sha256-Mp4chq9QuQB19FrOZBhmUtPrDoEpZZna79+MZs9rGUo="
upstream_pr = "https://github.com/openai/codex/pull/8417"
status = "carried"
risk = "low"
owner = "local"
notes = "Play a configurable best-effort desktop notification sound alongside OSC9 notifications; `[tui].notification_sound.command` can override the argv and `enabled = false` disables it. Defaults remain afplay/osascript on macOS and canberra/paplay/pw-play/aplay on Linux; skipped for the Bel backend, which already rings. Preserves the existing unfocused-only notification gate. Sound commands run single-flight under a bounded asynchronous supervisor that kills and reaps hung children."

[[patches]]
name = "plan-mode-default"
enabled = true
file = "patches/plan-mode-default.patch"
upstream_base = "rust-v0.157.0"
upstream_sha = "00c972ed5d6ff6499317fd41b7f23605b8e6850d"
