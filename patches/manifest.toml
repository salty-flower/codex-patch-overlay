[release]
patch_suffix = "patch.1"
upstream_repo = "openai/codex"
upstream_package = "codex"

# One entry per carried or candidate patch.
# Disabled entries document candidates without affecting the build.

[[patches]]
name = "stream-reasoning-live"
enabled = true
file = "patches/stream-reasoning-live.patch"
upstream_base = "rust-v0.144.3"
upstream_sha = "78ad6e6bfd1d3b6a209acd3ef82172a96b25179c"
source_hash = "sha256-TtOzSLByGf+8K5fs0b92wJ4e9tBZvFbJqfMtvSuGU58="
cargo_hash = "sha256-S4dsZXfmKvJItL2XYKyxfhqdCMATEG6oPjrtVRwkuYc="
upstream_issue = "https://github.com/openai/codex/issues/5339"
upstream_pr = "https://github.com/openai/codex/pull/6006"
status = "carried"
risk = "medium"
owner = "local"
notes = "Show streamed reasoning summaries in the TUI history; verify with model_reasoning_summary=detailed."

[[patches]]
name = "tui-notification-sound"
enabled = true
file = "patches/tui-notification-sound.patch"
upstream_base = "rust-v0.144.3"
upstream_sha = "78ad6e6bfd1d3b6a209acd3ef82172a96b25179c"
source_hash = "sha256-TtOzSLByGf+8K5fs0b92wJ4e9tBZvFbJqfMtvSuGU58="
cargo_hash = "sha256-S4dsZXfmKvJItL2XYKyxfhqdCMATEG6oPjrtVRwkuYc="
upstream_pr = "https://github.com/openai/codex/pull/8417"
status = "carried"
risk = "low"
owner = "local"
notes = "Play a configurable best-effort desktop notification sound alongside OSC9 notifications; `[tui].notification_sound.command` can override the argv and `enabled = false` disables it. Defaults remain afplay/osascript on macOS and canberra/paplay/pw-play/aplay on Linux; skipped for the Bel backend, which already rings. Preserves the existing unfocused-only notification gate."

[[patches]]
name = "webp-image-input"
enabled = true
file = "patches/webp-image-input.patch"
upstream_base = "rust-v0.144.3"
upstream_sha = "78ad6e6bfd1d3b6a209acd3ef82172a96b25179c"
source_hash = "sha256-TtOzSLByGf+8K5fs0b92wJ4e9tBZvFbJqfMtvSuGU58="
cargo_hash = "sha256-S4dsZXfmKvJItL2XYKyxfhqdCMATEG6oPjrtVRwkuYc="
upstream_issue = "https://github.com/openai/codex/issues/8562"
upstream_pr = "https://github.com/openai/codex/pull/8589"
status = "carried"
risk = "low"
owner = "local"
notes = "Recognize .webp paste/attach paths in the TUI composer as WEBP; decode + webp image feature already exist upstream at this base. Verify by attaching a .webp image in the composer."

[[patches]]
name = "session-delete"
enabled = false
file = "patches/session-delete.patch"
upstream_base = "rust-v0.139.0"
upstream_sha = "a7dff904308535e965aee87680c1fc5ef1d19eec"
