[release]
patch_suffix = "patch.3"
upstream_repo = "openai/codex"
upstream_package = "codex"

# One entry per carried or candidate patch.
# Disabled entries document candidates without affecting the build.

[[patches]]
name = "stream-reasoning-live"
enabled = true
file = "patches/stream-reasoning-live.patch"
upstream_base = "rust-v0.140.0"
upstream_sha = "6506579001c322927a3e4bd440563267a7ac6c1f"
source_hash = "sha256-VuvNXgyftiQke8qLA7HEySkP4S2TvMR++rrVJAfVc4Y="
cargo_hash = "sha256-8nvIfbq2EKqbF4fyzB5wakQilV4NU5S2wSXJk1KGnB0="
upstream_issue = "https://github.com/openai/codex/issues/5339"
upstream_pr = "https://github.com/openai/codex/pull/6006"
status = "carried"
risk = "medium"
owner = "local"
notes = "Show streamed reasoning summaries in the TUI history; verify with model_reasoning_summary=detailed."

[[patches]]
name = "tui-notification-sound"
enabled = true
file = "patches/tui-notification-sound.patch"
upstream_base = "rust-v0.140.0"
upstream_sha = "6506579001c322927a3e4bd440563267a7ac6c1f"
source_hash = "sha256-VuvNXgyftiQke8qLA7HEySkP4S2TvMR++rrVJAfVc4Y="
cargo_hash = "sha256-8nvIfbq2EKqbF4fyzB5wakQilV4NU5S2wSXJk1KGnB0="
upstream_pr = "https://github.com/openai/codex/pull/8417"
status = "carried"
risk = "low"
owner = "local"
notes = "Play a configurable best-effort desktop notification sound alongside OSC9 notifications; `[tui].notification_sound.command` can override the argv and `enabled = false` disables it. Defaults remain afplay/osascript on macOS and canberra/paplay/pw-play/aplay on Linux; skipped for the Bel backend, which already rings. Preserves the existing unfocused-only notification gate."

[[patches]]
name = "webp-image-input"
enabled = true
file = "patches/webp-image-input.patch"
upstream_base = "rust-v0.140.0"
upstream_sha = "6506579001c322927a3e4bd440563267a7ac6c1f"
source_hash = "sha256-VuvNXgyftiQke8qLA7HEySkP4S2TvMR++rrVJAfVc4Y="
cargo_hash = "sha256-8nvIfbq2EKqbF4fyzB5wakQilV4NU5S2wSXJk1KGnB0="
upstream_issue = "https://github.com/openai/codex/issues/8562"
upstream_pr = "https://github.com/openai/codex/pull/8589"
status = "carried"
risk = "low"
owner = "local"
notes = "Recognize .webp paste/attach paths in the TUI composer as WEBP; decode + webp image feature already exist upstream at this base. Verify by attaching a .webp image in the composer."

[[patches]]
name = "session-delete"
enabled = false
file = "patches/session-delete.patch"
upstream_base = "rust-v0.139.0"
upstream_sha = "a7dff904308535e965aee87680c1fc5ef1d19eec"
source_hash = "sha256-XjzlkBUkBey+P3tFLDYB3ae5oseUfW5tmzhLzqlqj2E="
cargo_hash = "sha256-8mN4OTRJvt2mBYHQXZS55PSOChLqEIiXwPu2y+2MZ9o="
upstream_issue = "https://github.com/openai/codex/issues/8784"
upstream_pr = "https://github.com/openai/codex/pull/27476"
status = "retired"
risk = "low"
owner = "local"
notes = "Retired for rust-v0.140.0: upstream added app-server `thread/delete` in openai/codex#25018 and CLI/TUI delete-session commands in openai/codex#27476."

[[patches]]
name = "disable-autocompact"
enabled = true
file = "patches/disable-autocompact.patch"
upstream_base = "rust-v0.140.0"
upstream_sha = "6506579001c322927a3e4bd440563267a7ac6c1f"
source_hash = "sha256-VuvNXgyftiQke8qLA7HEySkP4S2TvMR++rrVJAfVc4Y="
cargo_hash = "sha256-8nvIfbq2EKqbF4fyzB5wakQilV4NU5S2wSXJk1KGnB0="
upstream_issue = "https://github.com/openai/codex/issues/4106"
status = "carried"
risk = "low"
owner = "local"
notes = "Add `auto_compact = false` config option to disable automatic context compaction. Guards both pre-turn and mid-turn compaction triggers in turn.rs. Defaults to true (existing behavior). A/B check with `cargo run -p codex-cli --bin codex -- -c model_auto_compact_token_limit=1 -c auto_compact=false --no-alt-screen` versus the same command without `-c auto_compact=false`; the enabled/default run should compact."

[[patches]]
name = "token-usage-breakdown"
enabled = true
file = "patches/token-usage-breakdown.patch"
upstream_base = "rust-v0.140.0"
upstream_sha = "6506579001c322927a3e4bd440563267a7ac6c1f"
source_hash = "sha256-VuvNXgyftiQke8qLA7HEySkP4S2TvMR++rrVJAfVc4Y="
cargo_hash = "sha256-8nvIfbq2EKqbF4fyzB5wakQilV4NU5S2wSXJk1KGnB0="
upstream_issue = "https://github.com/openai/codex/issues/13222"
status = "carried"
risk = "low"
owner = "local"
notes = "Add a 'Context input' row to the TUI /status display showing non-cached vs cached input tokens with a cached percentage. Helps users identify how much of their context window is consumed by fresh (paid) vs cached (free/cheap) tokens. Verify by running /status in a session with conversation history; the new row appears below 'Context window' when cached tokens are present."

[[patches]]
name = "plan-mode-default"
enabled = true
file = "patches/plan-mode-default.patch"
upstream_base = "rust-v0.140.0"
upstream_sha = "6506579001c322927a3e4bd440563267a7ac6c1f"
source_hash = "sha256-VuvNXgyftiQke8qLA7HEySkP4S2TvMR++rrVJAfVc4Y="
cargo_hash = "sha256-8nvIfbq2EKqbF4fyzB5wakQilV4NU5S2wSXJk1KGnB0="
upstream_issue = "https://github.com/openai/codex/issues/13942"
status = "carried"
risk = "low"
owner = "local"
notes = "Add `tui.default_collaboration_mode = \"plan\"` config option to launch the TUI in Plan mode instead of Code mode. Falls back to default on invalid values. Verify with `codex -c 'tui.default_collaboration_mode=\"plan\"' --no-alt-screen`; the TUI should start in Plan mode."

[[patches]]
name = "timed-queue"
enabled = true
file = "patches/timed-queue.patch"
upstream_base = "rust-v0.140.0"
upstream_sha = "6506579001c322927a3e4bd440563267a7ac6c1f"
source_hash = "sha256-VuvNXgyftiQke8qLA7HEySkP4S2TvMR++rrVJAfVc4Y="
cargo_hash = "sha256-8nvIfbq2EKqbF4fyzB5wakQilV4NU5S2wSXJk1KGnB0="
upstream_issue = "local-request"
status = "carried"
risk = "medium"
owner = "local"
notes = "Add `/schedule in <minutes> <prompt>` and `/schedule at <HH:MM> <prompt>` to queue a follow-up prompt for a strict future time. Due prompts drain immediately when idle, or wait for the current turn to finish if Codex is still running. The pending-input preview shows both the target wall-clock time (HH:MM:SS) and a live countdown refreshed every 10 seconds."
