[release]
patch_suffix = "patch.1"
upstream_repo = "openai/codex"
upstream_package = "codex"

# One entry per carried or candidate patch.
# Disabled entries document candidates without affecting the build.

[[patches]]
name = "tui-notification-sound"
enabled = true
file = "patches/tui-notification-sound.patch"
upstream_base = "rust-v0.153.4"
upstream_sha = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"
source_hash = "sha256-lHiDj5SodaM3mh8goMm6esfejeAT+Y3JJWrRnyj6sJo="
cargo_hash = "sha256-GG6kOXmCdq+bZLU2ul0DIVL8lDuweayvZvXn6+bcUZw="
upstream_pr = "https://github.com/openai/codex/pull/8417"
status = "carried"
risk = "low"
owner = "local"
notes = "Play a configurable best-effort desktop notification sound alongside OSC9 notifications; `[tui].notification_sound.command` can override the argv and `enabled = false` disables it. Defaults remain afplay/osascript on macOS and canberra/paplay/pw-play/aplay on Linux; skipped for the Bel backend, which already rings. Preserves the existing unfocused-only notification gate."

[[patches]]
name = "plan-mode-default"
enabled = true
file = "patches/plan-mode-default.patch"
upstream_base = "rust-v0.153.4"
upstream_sha = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"
source_hash = "sha256-lHiDj5SodaM3mh8goMm6esfejeAT+Y3JJWrRnyj6sJo="
cargo_hash = "sha256-GG6kOXmCdq+bZLU2ul0DIVL8lDuweayvZvXn6+bcUZw="
upstream_issue = "https://github.com/openai/codex/issues/13942"
status = "carried"
risk = "low"
owner = "local"
notes = "Add `tui.default_collaboration_mode = \"plan\"` config option to launch the TUI in Plan mode instead of Code mode. Falls back to default on invalid values. Verify with `codex -c 'tui.default_collaboration_mode=\"plan\"' --no-alt-screen`; the TUI should start in Plan mode."

[[patches]]
name = "timed-queue"
enabled = true
file = "patches/timed-queue.patch"
upstream_base = "rust-v0.153.4"
upstream_sha = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"
source_hash = "sha256-lHiDj5SodaM3mh8goMm6esfejeAT+Y3JJWrRnyj6sJo="
cargo_hash = "sha256-GG6kOXmCdq+bZLU2ul0DIVL8lDuweayvZvXn6+bcUZw="
upstream_issue = "local-request"
status = "carried"
risk = "medium"
owner = "local"
notes = "Add `/later <delay> <prompt>` to queue a follow-up prompt for a strict future time. The time spec accepts a relative delay (`10m`, `1h30m`, `90s`, bare number = minutes), a clock time `HH:MM[:SS]` (today, or tomorrow if already past), or an absolute `YYYY-MM-DD HH:MM[:SS]`. Due prompts drain immediately when idle, or wait for the current turn to finish if Codex is still running. The pending-input preview shows both the target wall-clock time (HH:MM:SS) and a live countdown refreshed every 10 seconds. Carries the default command-popup snapshot so the new `/later` entry does not fail `just test -p codex-tui`."

[[patches]]
name = "tui-status-line-command"
enabled = true
file = "patches/tui-status-line-command.patch"
upstream_base = "rust-v0.153.4"
upstream_sha = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"
source_hash = "sha256-lHiDj5SodaM3mh8goMm6esfejeAT+Y3JJWrRnyj6sJo="
cargo_hash = "sha256-GG6kOXmCdq+bZLU2ul0DIVL8lDuweayvZvXn6+bcUZw="
upstream_issue = "https://github.com/openai/codex/issues/17827"
status = "carried"
risk = "high"
owner = "local"
notes = "Add opt-in `[tui.status_line_command]` direct-argv rendering with a versioned JSON stdin contract, COLUMNS/LINES, single-flight coalescing, bounded timeout/output, built-in fallback before first success, retained same-thread last success after later failures, SGR-only ANSI parsing, and a maximum of two safely clipped passive footer rows. Successful command output takes priority over the configured built-in status line in every passive footer layout. Periodic refresh deadlines survive unrelated immediate redraws, and current input usage is split into non-cached and cache-read tokens. Snapshot `approval_mode` mirrors the built-in approval-mode item so the on-request reviewer toggle is distinguishable (approve-for-me / ask-for-approval). A first valid terminal resize retries once after the constructor's zero-sized startup refresh, while identical resize notifications remain single-flight."

[[patches]]
name = "editable-enter-queue"
enabled = true
file = "patches/editable-enter-queue.patch"
upstream_base = "rust-v0.153.4"
upstream_sha = "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"
source_hash = "sha256-lHiDj5SodaM3mh8goMm6esfejeAT+Y3JJWrRnyj6sJo="
cargo_hash = "sha256-GG6kOXmCdq+bZLU2ul0DIVL8lDuweayvZvXn6+bcUZw="
upstream_issue = "local-request"
status = "carried"
risk = "high"
owner = "local"
notes = "Preserve vanilla same-turn Enter steering while adding an experimental, core-arbitrated recall window before atomic input consumption. TUI-generated UUIDv7 client message IDs flow through turn/start or turn/steer and committed user-item notifications; Alt+Up recalls the globally latest editable Enter/Tab input, restores it only on recalled/alreadyRecalled, and keeps claimed inputs hidden until their exact committed item arrives. Shell escapes, Plan streaming, and Tab next-turn semantics remain unchanged. This patch must not be retired merely because upstream exposes a queued-message editor: retirement requires equivalent core arbitration and an exact pending-steer recall protocol. Generated compressed app-server schema exports are carried as binary payloads and installed by the overlay because Nix's patch hook does not apply Git binary diffs."
