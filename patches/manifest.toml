[release]
patch_suffix = "patch.2"
upstream_repo = "openai/codex"
upstream_package = "codex"

# One entry per carried or candidate patch.
# Disabled entries document candidates without affecting the build.

[[patches]]
name = "stream-reasoning-live"
enabled = true
file = "patches/stream-reasoning-live.patch"
upstream_base = "rust-v0.137.0"
upstream_sha = "f221438b691b8f749d98f22077c93ebe01923fbe"
source_hash = "sha256-puszZqi1lZeq8iXWAD9U9+WMnNvzMYKf6wVT9mtjSUU="
cargo_hash = "sha256-SX5LMO+IWismbH61Jd0g1mgykfav8DrqG+wjyNCWyCo="
upstream_issue = "https://github.com/openai/codex/issues/5339"
upstream_pr = "https://github.com/openai/codex/pull/6006"
status = "carried"
risk = "medium"
owner = "local"
notes = "Show streamed reasoning summaries in the TUI history; verify with model_reasoning_summary=detailed."

[[patches]]
name = "tui-notification-sound"
enabled = true
file = "patches/tui-notification-sound.patch"
upstream_base = "rust-v0.137.0"
upstream_sha = "f221438b691b8f749d98f22077c93ebe01923fbe"
source_hash = "sha256-puszZqi1lZeq8iXWAD9U9+WMnNvzMYKf6wVT9mtjSUU="
cargo_hash = "sha256-SX5LMO+IWismbH61Jd0g1mgykfav8DrqG+wjyNCWyCo="
upstream_pr = "https://github.com/openai/codex/pull/8417"
status = "carried"
risk = "low"
owner = "local"
notes = "Play a best-effort desktop notification sound alongside OSC9 notifications (afplay/osascript on macOS; canberra/paplay/pw-play/aplay on Linux); skipped for the Bel backend, which already rings. Preserves the existing unfocused-only notification gate."

[[patches]]
name = "webp-image-input"
enabled = true
file = "patches/webp-image-input.patch"
upstream_base = "rust-v0.137.0"
upstream_sha = "f221438b691b8f749d98f22077c93ebe01923fbe"
source_hash = "sha256-puszZqi1lZeq8iXWAD9U9+WMnNvzMYKf6wVT9mtjSUU="
cargo_hash = "sha256-SX5LMO+IWismbH61Jd0g1mgykfav8DrqG+wjyNCWyCo="
upstream_issue = "https://github.com/openai/codex/issues/8562"
upstream_pr = "https://github.com/openai/codex/pull/8589"
status = "carried"
risk = "low"
owner = "local"
notes = "Recognize .webp paste/attach paths in the TUI composer as WEBP; decode + webp image feature already exist upstream at this base. Verify by attaching a .webp image in the composer."

[[patches]]
name = "session-delete"
enabled = true
file = "patches/session-delete.patch"
upstream_base = "rust-v0.137.0"
upstream_sha = "f221438b691b8f749d98f22077c93ebe01923fbe"
source_hash = "sha256-puszZqi1lZeq8iXWAD9U9+WMnNvzMYKf6wVT9mtjSUU="
cargo_hash = "sha256-SX5LMO+IWismbH61Jd0g1mgykfav8DrqG+wjyNCWyCo="
upstream_issue = "https://github.com/openai/codex/issues/8784"
status = "carried"
risk = "low"
owner = "local"
notes = "Add `codex delete <session>` subcommand to permanently remove a session (SQLite metadata + on-disk rollout file). Reuses archive/unarchive patterns for CLI dispatch, app-server RPC, and session resolution."

[[patches]]
name = "disable-autocompact"
enabled = true
file = "patches/disable-autocompact.patch"
upstream_base = "rust-v0.137.0"
upstream_sha = "f221438b691b8f749d98f22077c93ebe01923fbe"
source_hash = "sha256-puszZqi1lZeq8iXWAD9U9+WMnNvzMYKf6wVT9mtjSUU="
cargo_hash = "sha256-SX5LMO+IWismbH61Jd0g1mgykfav8DrqG+wjyNCWyCo="
upstream_issue = "https://github.com/openai/codex/issues/4106"
status = "carried"
risk = "low"
owner = "local"
notes = "Add `auto_compact = false` config option to disable automatic context compaction. Guards both pre-turn and mid-turn compaction triggers in turn.rs. Defaults to true (existing behavior)."
