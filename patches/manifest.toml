[[patches]]
name = "tui-reasoning-display"
enabled = true
file = "patches/tui-reasoning-display.patch"
upstream_base = "rust-v0.157.0"
upstream_sha = "00c972ed5d6ff6499317fd41b7f23605b8e6850d"
source_hash = "sha256-/f/k77vnFjPfnnf+X2E7rY2FxUR1xAcJZiPTv9Q8JVI="
cargo_hash = "sha256-Mp4chq9QuQB19FrOZBhmUtPrDoEpZZna79+MZs9rGUo="
