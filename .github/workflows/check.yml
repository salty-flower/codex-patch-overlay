name: check

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull-request run cannot change the verdict, so stop paying for
  # it. Releases and main pushes still run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-nix
      - run: nix develop --command nu scripts/check-editable-enter-queue.nu
      - run: nix flake check --all-systems

  # `nix flake check` builds the patched package with its `doCheck` disabled, so
  # no bundled test runs in the nix gate and a broken test can ship unnoticed.
  # Build the same patched tree outside nix and run the tests the enabled
  # patches add.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Mirrors the upstream justfile's test recipe, bumped from its 8 MiB:
      # `agents_overview::tests::overview_cold_resume_honors_working_directory_selection`
      # runs as a plain `#[tokio::test]` with no explicit thread stack size,
      # so it falls through to this env-derived default and overflowed an
      # 8 MiB budget on the previous runner/toolchain combination.
      # Tests with explicit thread/runtime stack sizes retain their own limits.
      RUST_MIN_STACK: "16777216"
      RUST_BACKTRACE: "1"
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The same set upstream's nextest workflow installs. `libasound2-dev`
          # in particular is what the ALSA-backed tui dependency links against.
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libasound2-dev bubblewrap

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Stage patched upstream
        shell: bash
        run: |
          set -euo pipefail
          upstream_repo="$(awk -F'"' '/^upstream_repo =/ { print $2; exit }' patches/manifest.toml)"
          upstream_base="$(awk -F'"' '/^upstream_base =/ { print $2; exit }' patches/manifest.toml)"
          upstream_sha="$(awk -F'"' '/^upstream_sha =/ { print $2; exit }' patches/manifest.toml)"

          mkdir -p staging
          git clone --filter=blob:none "https://github.com/${upstream_repo}.git" staging/openai-codex
          git -C staging/openai-codex checkout --detach "${upstream_sha:-$upstream_base}"

          awk '
            /^name = / { name = $0; sub(/^name = "/, "", name); sub(/"$/, "", name) }
            /^enabled = true/ { enabled = 1 }
            /^file = / && enabled == 1 { file = $0; sub(/^file = "/, "", file); sub(/"$/, "", file); print name "\t" file; enabled = 0 }
          ' patches/manifest.toml | while IFS=$'\t' read -r patch_name patch_file; do
            echo "applying ${patch_name}: ${patch_file}"
            git -C staging/openai-codex apply --check "../../${patch_file}"
            git -C staging/openai-codex apply "../../${patch_file}"
          done

      - name: Match the workspace version to the test fixtures
        working-directory: staging/openai-codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # The tagged commit's Cargo.toml carries the release version, but the
          # checked-in insta snapshots (and this run's own assertions) were
          # captured against the "0.0.0" placeholder the workspace normally
          # builds at. `env!("CARGO_PKG_VERSION")` is a compile-time read of
          # this field with no test-time override, so building from the tag as
          # committed fails ~30 otherwise-unrelated snapshot tests. This does
          # not touch the release build, which never runs tests.
          sed -i 's/^version = ".*"$/version = "0.0.0"/' Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Install carried schema payloads
        shell: bash
        run: |
          set -euo pipefail
          # Nix's patch hook cannot consume the binary payloads the
          # editable-enter-queue patch carries; the overlay installs them in
          # postPatch. Mirror that so the tested tree matches the built one.
          for kind in stable experimental; do
            install -Dm644 "patches/editable-enter-queue-app-server-exports-${kind}.json.zst" \
              "staging/openai-codex/codex-rs/app-server-protocol/schema/precomputed/app-server-exports-${kind}.json.zst"
          done

      - name: Configure rusty_v8 artifacts
        shell: bash
        run: |
          set -euo pipefail
          # The v8 crate cannot fetch this build variant from its own release
          # page; resolve the version the staged upstream actually pins.
          version="$(python3 staging/openai-codex/.github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)"
          base_url="https://github.com/openai/codex/releases/download/rusty-v8-v${version}"
          artifact_dir="${GITHUB_WORKSPACE}/.rusty_v8"
          profile="ptrcomp_sandbox_release"
          archive_name="librusty_v8_${profile}_${TARGET}.a.gz"
          binding_name="src_binding_${profile}_${TARGET}.rs"
          checksums_name="rusty_v8_${profile}_${TARGET}.sha256"
          archive_path="${artifact_dir}/${archive_name}"
          binding_path="${artifact_dir}/${binding_name}"
          checksums_path="${artifact_dir}/${checksums_name}"
          trusted_checksums="staging/openai-codex/third_party/v8/rusty_v8_${version//./_}_release_manifests.sha256"

          if command -v sha256sum >/dev/null 2>&1; then
            checksum_command=(sha256sum --check -)
          else
            checksum_command=(shasum -a 256 --check -)
          fi

          mkdir -p "${artifact_dir}"
          curl -fsSL "${base_url}/${checksums_name}" -o "${checksums_path}"
          # Verify the manifest against the copy trusted by the pinned upstream source.
          expected_manifest_checksum="$(awk -v name="$checksums_name" '{sub(/\r$/, "", $2)} $2 == name {print $1}' "$trusted_checksums")"
          actual_manifest_checksum="$(shasum -a 256 "$checksums_path" | awk '{print $1}')"
          if [[ -z "$expected_manifest_checksum" || "$actual_manifest_checksum" != "$expected_manifest_checksum" ]]; then
            echo "Checksum mismatch for ${checksums_name}: expected ${expected_manifest_checksum}, got ${actual_manifest_checksum}" >&2
            exit 1
          fi

          curl -fsSL "${base_url}/${archive_name}" -o "${archive_path}"
          curl -fsSL "${base_url}/${binding_name}" -o "${binding_path}"

          if [[ "$(wc -l < "${checksums_path}")" -ne 2 ]]; then
            echo "Expected exactly two checksums for ${TARGET} in ${checksums_path}" >&2
            exit 1
          fi
          (cd "${artifact_dir}" && tr -d '\r' < "${checksums_path}" | "${checksum_command[@]}")

          # Not $RUNNER_TEMP: the v8 build script bakes this directory into its
          # cached output as a linker search path, and a per-run path goes stale
          # on the next cache hit.
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: staging/openai-codex/codex-rs -> target
          key: test

      - name: Force-rebuild rusty_v8 against this run's archive
        working-directory: staging/openai-codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # A cache hit restores the v8 build-script output, whose linker path
          # only this run's archive populates; without this the link fails with
          # `could not find native static library rusty_v8`.
          cargo clean -p v8 --target "$TARGET"

      - uses: taiki-e/install-action@nextest

      - name: Test patched crates
        working-directory: staging/openai-codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # Run unit tests from every crate touched by the carried patches.
          # The next step covers their process-level integration tests.
          #
          # Recheck the historical Linux exclusions on 0.157 and stable Rust.
          # Keep process-heavy tests at two concurrent cases to limit contention.
          # TLS fallback fixtures require the platform's default TLS backend.
          # A custom CA environment selects rustls before those fixtures run;
          # custom-CA tests supply their own explicit environment independently.
          # Invoke nextest directly: Cargo's own OpenSSL initialization can
          # reintroduce SSL_CERT_FILE before launching `cargo nextest` on Linux.
          for name in CODEX_CA_CERTIFICATE SSL_CERT_FILE; do
            if [[ -n "${!name:-}" ]]; then
              echo "Isolating inherited ${name} from unit test fixtures"
            fi
          done
          env -u CODEX_CA_CERTIFICATE -u SSL_CERT_FILE \
            cargo-nextest nextest run --no-fail-fast --test-threads 2 --lib \
            -p codex-tui \
            -p codex-api \
            -p codex-login \
            -p codex-core \
            -p codex-app-server-protocol \
            -p codex-app-server \
            -p codex-protocol \
            -p codex-model-provider \
            -p codex-http-client

      - name: Verify code mode links sandbox-enabled V8
        working-directory: staging/openai-codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          env -u CODEX_CA_CERTIFICATE -u SSL_CERT_FILE \
            cargo test -p codex-code-mode-runtime --lib \
            runtime::tests::linked_v8_has_sandbox_enabled -- --exact

      - name: Check the public core API sample
        working-directory: staging/openai-codex/codex-rs
        run: cargo check -p codex-thread-manager-sample

      - name: Test carried integration scenarios
        working-directory: staging/openai-codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run --no-fail-fast --test-threads 1 --test all \
            -p codex-core -p codex-app-server -p codex-login \
            -E 'test(rotate_) or test(account_rotate) or test(login_server) or test(responses_websocket_blackholed_reuse_reconnects_with_full_context)'
