name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command nu scripts/check-editable-enter-queue.nu
      - run: nix flake check
