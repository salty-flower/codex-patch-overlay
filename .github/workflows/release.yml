name: release

on:
  push:
    tags:
      - "codex-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CARGO_BUILD_JOBS: 2
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_LTO: "false"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Configure macOS linker
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          classic_linker="$(xcrun --find ld-classic)"
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-fuse-ld=${classic_linker}" >> "$GITHUB_ENV"

      - name: Stage patched upstream
        shell: bash
        run: |
          set -euo pipefail
          upstream_repo="$(awk -F'"' '/^upstream_repo =/ { print $2; exit }' patches/manifest.toml)"
          upstream_base="$(awk -F'"' '/^upstream_base =/ { print $2; exit }' patches/manifest.toml)"
          upstream_sha="$(awk -F'"' '/^upstream_sha =/ { print $2; exit }' patches/manifest.toml)"

          mkdir -p staging
          git clone --filter=blob:none "https://github.com/${upstream_repo}.git" staging/openai-codex
          git -C staging/openai-codex checkout --detach "${upstream_sha:-$upstream_base}"

          awk '
            /^name = / { name = $0; sub(/^name = "/, "", name); sub(/"$/, "", name) }
            /^enabled = true/ { enabled = 1 }
            /^file = / && enabled == 1 { file = $0; sub(/^file = "/, "", file); sub(/"$/, "", file); print name "\t" file; enabled = 0 }
          ' patches/manifest.toml | while IFS=$'\t' read -r patch_name patch_file; do
            echo "applying ${patch_name}: ${patch_file}"
            git -C staging/openai-codex apply --check "../../${patch_file}"
            git -C staging/openai-codex apply "../../${patch_file}"
          done

      - name: Install carried schema payloads
        shell: bash
        run: |
          set -euo pipefail
          # These compressed exports are embedded at compile time. Match the
          # tested tree and Nix postPatch before building release binaries.
          for kind in stable experimental; do
            cp "patches/editable-enter-queue-app-server-exports-${kind}.json.zst" \
              "staging/openai-codex/codex-rs/app-server-protocol/schema/precomputed/app-server-exports-${kind}.json.zst"
          done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Fetch packaged ripgrep
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          codex_repo="${GITHUB_WORKSPACE}/staging/openai-codex"
          rg_bin="$(
            CODEX_REPO_ROOT="${codex_repo}" PYTHONPATH="${codex_repo}/scripts" \
              python3 -c 'import os; from codex_package.ripgrep import fetch_rg; from codex_package.targets import TARGET_SPECS; print(fetch_rg(TARGET_SPECS[os.environ["TARGET"]]))'
          )"
          test -x "${rg_bin}"
          echo "CODEX_RG_BIN=${rg_bin}" >> "${GITHUB_ENV}"

      - name: Fetch packaged zsh
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          codex_repo="${GITHUB_WORKSPACE}/staging/openai-codex"
          zsh_bin="$(
            CODEX_REPO_ROOT="${codex_repo}" PYTHONPATH="${codex_repo}/scripts" \
              python3 -c 'import os; from codex_package.zsh import resolve_zsh_bin; from codex_package.targets import TARGET_SPECS; print(resolve_zsh_bin(TARGET_SPECS[os.environ["TARGET"]]))'
          )"
          test -x "${zsh_bin}"
          echo "CODEX_ZSH_BIN=${zsh_bin}" >> "${GITHUB_ENV}"

      - name: Use hermetic Cargo home for musl
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig for musl
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          zig_dir="${RUNNER_TEMP}/zig"
          mkdir -p "$zig_dir"
          curl -fsSL https://ziglang.org/download/index.json -o "$zig_dir/index.json"
          version="$(jq -r 'keys | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | max_by(split(".") | map(tonumber))' "$zig_dir/index.json")"
          archive_url="$(jq -er --arg version "$version" '.[$version]["x86_64-linux"].tarball' "$zig_dir/index.json")"
          archive_sha="$(jq -er --arg version "$version" '.[$version]["x86_64-linux"].shasum' "$zig_dir/index.json")"
          curl -fsSL "$archive_url" -o "$zig_dir/zig.tar.xz"
          printf '%s  %s\n' "$archive_sha" "$zig_dir/zig.tar.xz" | sha256sum --check -
          tar -xJf "$zig_dir/zig.tar.xz" --strip-components=1 -C "$zig_dir"
          "$zig_dir/zig" version
          echo "$zig_dir" >> "$GITHUB_PATH"

      - name: Install musl build tools
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          ci_patches="${RUNNER_TEMP}/release-ci-patches"
          mkdir -p "$ci_patches"
          # A retry may run a corrected workflow against an existing source tag.
          # Keep CI-only installer patches tied to that workflow's exact commit.
          for patch_file in codex-musl-openssl-install-hook.patch openssl-install-vars-defaults.patch; do
            git show "${RELEASE_WORKFLOW_SHA}:scripts/ci/${patch_file}" > "$ci_patches/$patch_file"
          done
          git -C staging/openai-codex apply --check "$ci_patches/codex-musl-openssl-install-hook.patch"
          git -C staging/openai-codex apply "$ci_patches/codex-musl-openssl-install-hook.patch"
          export OPENSSL_INSTALL_VARS_PATCH="$ci_patches/openssl-install-vars-defaults.patch"
          bash staging/openai-codex/.github/scripts/install-musl-build-tools.sh
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rustc UBSan wrapper for musl host tools
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/' || true)"
          fi

          wrapper="${RUNNER_TEMP}/rustc-ubsan-wrapper"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$@"
          EOF
          chmod 0755 "$wrapper"

          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - name: Clear sanitizer flags for musl
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_ENCODED_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "RUSTDOCFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"

          sanitize_flags() {
            local input="$1"
            input="${input//-fsanitize=undefined/}"
            input="${input//-fno-sanitize-recover=undefined/}"
            input="${input//-fno-sanitize-trap=undefined/}"
            echo "$input"
          }
          echo "CFLAGS=$(sanitize_flags "${CFLAGS-}")" >> "$GITHUB_ENV"
          echo "CXXFLAGS=$(sanitize_flags "${CXXFLAGS-}")" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(python3 staging/openai-codex/.github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)"
          release_tag="rusty-v8-v${version}"
          base_url="https://github.com/openai/codex/releases/download/${release_tag}"
          # Stage under a run-stable path (not $RUNNER_TEMP, which changes every
          # run). The `v8` crate bakes this archive's absolute directory into its
          # cached build-script output as the linker search path; a per-run temp
          # path goes stale on the next rust-cache full match (same Cargo.lock,
          # e.g. a patch.N+1 re-release) and breaks linking with
          # "could not find native static library `rusty_v8`".
          binding_dir="${GITHUB_WORKSPACE}/.rusty_v8"
          # Match code-mode-runtime's v8_enable_sandbox feature and upstream's
          # setup-rusty-v8 action; overrides bypass V8's feature-aware selection.
          profile="ptrcomp_sandbox_release"
          archive_name="librusty_v8_${profile}_${TARGET}.a.gz"
          binding_name="src_binding_${profile}_${TARGET}.rs"
          checksums_name="rusty_v8_${profile}_${TARGET}.sha256"
          archive_path="${binding_dir}/${archive_name}"
          binding_path="${binding_dir}/${binding_name}"
          checksums_path="${binding_dir}/${checksums_name}"
          trusted_checksums="staging/openai-codex/third_party/v8/rusty_v8_${version//./_}_release_manifests.sha256"

          mkdir -p "${binding_dir}"
          curl -fsSL "${base_url}/${checksums_name}" -o "${checksums_path}"
          expected_manifest_checksum="$(awk -v name="$checksums_name" '{sub(/\r$/, "", $2)} $2 == name {print $1}' "$trusted_checksums")"
          actual_manifest_checksum="$(shasum -a 256 "$checksums_path" | awk '{print $1}')"
          if [[ -z "$expected_manifest_checksum" || "$actual_manifest_checksum" != "$expected_manifest_checksum" ]]; then
            echo "V8 checksum manifest does not match the pinned upstream source" >&2
            exit 1
          fi
          curl -fsSL "${base_url}/${archive_name}" -o "${archive_path}"
          curl -fsSL "${base_url}/${binding_name}" -o "${binding_path}"

          if [[ "$(wc -l < "${checksums_path}")" -ne 2 ]]; then
            echo "Expected exactly two checksums for ${TARGET} in ${checksums_path}" >&2
            exit 1
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            (cd "${binding_dir}" && tr -d '\r' < "${checksums_path}" | sha256sum --check -)
          else
            (cd "${binding_dir}" && tr -d '\r' < "${checksums_path}" | shasum -a 256 --check -)
          fi

          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: staging/openai-codex/codex-rs -> target
          key: ${{ matrix.target }}

      - name: Force-rebuild rusty_v8 against this run's archive
        working-directory: staging/openai-codex/codex-rs
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # rust-cache restores the `v8` crate's build-script output, which bakes
          # an absolute linker search path for the prebuilt librusty_v8 provided
          # at build time (RUSTY_V8_ARCHIVE). On a cache hit that decompressed
          # library isn't regenerated, so the link fails with
          # "could not find native static library `rusty_v8`". Clean just the v8
          # crate so its build script re-runs against this run's archive.
          cargo clean -p v8 --release --target "$TARGET"

      - name: Build bwrap and export digest
        if: contains(matrix.target, 'linux')
        working-directory: staging/openai-codex/codex-rs
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" --bin bwrap
          bwrap_path="target/${TARGET}/release/bwrap"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Build release binaries
        working-directory: staging/openai-codex/codex-rs
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # codex-code-mode-host is mandatory from upstream 0.147.0: the
          # `code_mode_host` feature is stable and default-enabled, and the
          # in-process runtime is gone, so codex resolves a sibling
          # `codex-code-mode-host` next to its own executable and fails code
          # mode closed when it is missing.
          cargo build --release --target "$TARGET" \
            --bin codex \
            --bin codex-responses-api-proxy \
            --bin codex-code-mode-host

      - name: Verify linked V8 sandbox
        working-directory: staging/openai-codex/codex-rs
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo test --release --target "$TARGET" -p codex-code-mode-runtime --lib \
            runtime::tests::linked_v8_has_sandbox_enabled -- --exact

      - name: Package artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package_dir="dist/${RELEASE_TAG}-${TARGET}"
          mkdir -p "$package_dir/bin" "$package_dir/codex-resources/zsh/bin" "$package_dir/codex-path"
          upstream_base="$(awk -F'"' '/^upstream_base =/ { print $2; exit }' patches/manifest.toml)"
          jq -n --arg version "${upstream_base#rust-v}" --arg target "$TARGET" \
            '{layoutVersion: 1, version: $version, target: $target, variant: "codex", entrypoint: "bin/codex", resourcesDir: "codex-resources", pathDir: "codex-path"}' \
            > "$package_dir/codex-package.json"
          # Keep codex-code-mode-host in bin/ next to codex, matching upstream's
          # package layout (scripts/codex_package/layout.py) and the sibling
          # lookup in codex-rs/install-context.
          for binary in codex codex-responses-api-proxy codex-code-mode-host; do
            cp "staging/openai-codex/codex-rs/target/${TARGET}/release/${binary}" "$package_dir/bin/"
            chmod 0755 "$package_dir/bin/${binary}"
          done
          cp "$CODEX_RG_BIN" "$package_dir/codex-path/rg"
          chmod 0755 "$package_dir/codex-path/rg"
          cp "$CODEX_ZSH_BIN" "$package_dir/codex-resources/zsh/bin/zsh"
          chmod 0755 "$package_dir/codex-resources/zsh/bin/zsh"
          if [[ -f "staging/openai-codex/codex-rs/target/${TARGET}/release/bwrap" ]]; then
            cp "staging/openai-codex/codex-rs/target/${TARGET}/release/bwrap" "$package_dir/codex-resources/bwrap"
            chmod 0755 "$package_dir/codex-resources/bwrap"
          fi
          cp README.md LICENSE NOTICE patches/manifest.toml "$package_dir/"

          CODEX_PACKAGE_DIR="$package_dir" CODEX_REPO_ROOT="${GITHUB_WORKSPACE}/staging/openai-codex" \
            PYTHONPATH="${GITHUB_WORKSPACE}/staging/openai-codex/scripts" \
            python3 -c 'import os; from pathlib import Path; from codex_package.layout import validate_package_dir; from codex_package.targets import TARGET_SPECS, PACKAGE_VARIANTS; validate_package_dir(Path(os.environ["CODEX_PACKAGE_DIR"]), PACKAGE_VARIANTS["codex"], TARGET_SPECS[os.environ["TARGET"]], include_zsh=True)'

          # Exercise the actual archive payload on its native CI host before
          # publishing, including the Linux musl binaries that macOS cannot run.
          smoke_root="${RUNNER_TEMP}/codex-package-smoke"
          export CODEX_HOME="${smoke_root}/home"
          export TMPDIR="${smoke_root}/tmp"
          mkdir -p "$CODEX_HOME" "$TMPDIR"
          for binary in codex codex-responses-api-proxy codex-code-mode-host; do
            option=--help
            if [[ "$binary" == codex ]]; then option=--version; fi
            result=0
            "$package_dir/bin/$binary" "$option" > "${smoke_root}/stdout" 2> "${smoke_root}/stderr" || result=$?
            cat "${smoke_root}/stdout" "${smoke_root}/stderr"
            test "$result" -eq 0
            test -s "${smoke_root}/stdout"
            test ! -s "${smoke_root}/stderr"
          done

          # Name the archive, not "dist/<archive>", inside the sidecar: the
          # README tells consumers to run `shasum -a 256 -c <archive>.sha256`
          # from the download directory, where a dist/ prefix cannot resolve.
          archive_name="${RELEASE_TAG}-${TARGET}.tar.gz"
          tar -C dist -czf "dist/${archive_name}" "${RELEASE_TAG}-${TARGET}"
          ( cd dist && shasum -a 256 "$archive_name" > "${archive_name}.sha256" )

      - uses: actions/upload-artifact@v7
        with:
          name: codex-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          path: |
            dist/${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
            dist/${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - name: Download and verify build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_macos="codex-${RELEASE_TAG}-aarch64-apple-darwin"
          artifact_linux="codex-${RELEASE_TAG}-x86_64-unknown-linux-musl"
          artifact_work_dir="$(mktemp -d "${RUNNER_TEMP}/release-artifacts.XXXXXX")"

          if [[ -e dist ]]; then
            shopt -s dotglob nullglob
            existing_files=(dist/*)
            shopt -u dotglob nullglob
            if (( ${#existing_files[@]} > 0 )); then
              echo "dist must be empty before downloading artifacts" >&2
              exit 1
            fi
          else
            mkdir -p dist
          fi

          artifact_metadata="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          selected_artifacts="$(jq -ce \
            --arg macos "$artifact_macos" \
            --arg linux "$artifact_linux" '
              . as $response
              | $response.artifacts as $artifacts
              | [$artifacts[] | select(.expired == false)] as $live
              | if $response.total_count != ($artifacts | length) then
                  error("artifact listing was truncated; increase per_page")
                elif any($artifacts[]; .name != $macos and .name != $linux) then
                  error("run contains an unexpected build artifact")
                elif ([$live[].name] | unique | sort) != ([$macos, $linux] | sort) then
                  error("run must contain a non-expired artifact for each target")
                else
                  [$macos, $linux]
                  | map(. as $name
                    | ($live | map(select(.name == $name)) | sort_by(.created_at, .id) | last))
                end
              | if length != 2 or any(.[]; ((.digest | type) != "string") or ((.digest | test("^sha256:[0-9a-f]{64}$")) | not)) then
                  error("selected artifacts must each have a SHA-256 digest")
                else
                  .
                end
            ' <<< "$artifact_metadata")"

          echo "Selected build artifacts:"
          jq -r '.[] | "- \(.name) (id \(.id), \(.size_in_bytes) bytes, \(.digest))"' <<< "$selected_artifacts"
          artifact_rows="$(jq -r '.[] | [.name, (.id | tostring), .digest] | @tsv' <<< "$selected_artifacts")"

          while IFS=$'\t' read -r artifact_name artifact_id api_digest; do
            case "$artifact_name" in
              "$artifact_macos") target="aarch64-apple-darwin" ;;
              "$artifact_linux") target="x86_64-unknown-linux-musl" ;;
              *) echo "Unexpected selected artifact: $artifact_name" >&2; exit 1 ;;
            esac

            zip_path="${artifact_work_dir}/${artifact_id}.zip"
            unpack_dir="${artifact_work_dir}/${artifact_id}"
            mkdir -p "$unpack_dir"
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "$zip_path"

            expected_digest="${api_digest#sha256:}"
            actual_digest="$(sha256sum "$zip_path" | awk '{print $1}')"
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "Artifact digest mismatch for $artifact_name: expected $expected_digest, got $actual_digest" >&2
              exit 1
            fi

            archive_name="${RELEASE_TAG}-${target}.tar.gz"
            sidecar_name="${archive_name}.sha256"
            members="$(unzip -Z1 "$zip_path" | LC_ALL=C sort)"
            expected_members="$(printf '%s\n' "$archive_name" "$sidecar_name" | LC_ALL=C sort)"
            if [[ "$members" != "$expected_members" ]]; then
              echo "Unexpected files in $artifact_name artifact:" >&2
              printf '%s\n' "$members" >&2
              exit 1
            fi

            unzip -qq "$zip_path" -d "$unpack_dir"
            (
              cd "$unpack_dir"
              shasum -a 256 -c "$sidecar_name"
            )
            install -m 0644 "$unpack_dir/$archive_name" "dist/$archive_name"
            install -m 0644 "$unpack_dir/$sidecar_name" "dist/$sidecar_name"
            echo "Verified and unpacked $artifact_name"
          done <<< "$artifact_rows"

          expected_dist_files="$(printf '%s\n' \
            "${RELEASE_TAG}-aarch64-apple-darwin.tar.gz" \
            "${RELEASE_TAG}-aarch64-apple-darwin.tar.gz.sha256" \
            "${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" \
            "${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz.sha256" | LC_ALL=C sort)"
          actual_dist_files="$(printf '%s\n' dist/* | sed 's|^dist/||' | LC_ALL=C sort)"
          if [[ "$actual_dist_files" != "$expected_dist_files" ]]; then
            echo "dist does not contain exactly the two platform archives and their sidecars" >&2
            printf '%s\n' "$actual_dist_files" >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          upstream_repo="$(awk -F'"' '/^upstream_repo =/ { print $2; exit }' patches/manifest.toml)"
          upstream_base="$(awk -F'"' '/^upstream_base =/ { print $2; exit }' patches/manifest.toml)"
          upstream_sha="$(awk -F'"' '/^upstream_sha =/ { print $2; exit }' patches/manifest.toml)"

          {
            echo "# ${RELEASE_TAG}"
            echo
            echo "- Upstream: ${upstream_repo}@${upstream_base} (${upstream_sha})"
            echo "- Versioning: patch overlay release from \`patches/manifest.toml\`"
            echo "- Binaries: \`codex\`, \`codex-responses-api-proxy\`, \`codex-code-mode-host\`"
            echo
            echo "Enabled patches:"
            awk '
              /^name = / { name = $0; sub(/^name = "/, "", name); sub(/"$/, "", name) }
              /^enabled = true/ { print "- " name }
            ' patches/manifest.toml
            echo
            echo "Artifacts are built by GitHub Actions from the tagged manifest and include SHA-256 sidecar files."
          } > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          # Use the write PAT (as auto-release.yml does). The default
          # GITHUB_TOKEN, even with contents:write, returns
          # "Resource not accessible by integration" when updating a release
          # that already exists (e.g. a prerelease created out of band), which
          # only the app token is restricted from doing.
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - name: Read release metadata
        id: release-metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease="$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install-nix
        if: steps.release-metadata.outputs.prerelease != 'true'

      - name: Move latest release ref
        if: steps.release-metadata.outputs.prerelease != 'true'
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command nu scripts/move-latest-release-ref.nu "${RELEASE_TAG}"
