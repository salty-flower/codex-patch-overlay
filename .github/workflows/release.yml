name: release

on:
  push:
    tags:
      - "codex-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CARGO_BUILD_JOBS: 2
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_LTO: "false"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Stage patched upstream
        shell: bash
        run: |
          set -euo pipefail
          upstream_repo="$(awk -F'"' '/^upstream_repo =/ { print $2; exit }' patches/manifest.toml)"
          upstream_base="$(awk -F'"' '/^upstream_base =/ { print $2; exit }' patches/manifest.toml)"
          upstream_sha="$(awk -F'"' '/^upstream_sha =/ { print $2; exit }' patches/manifest.toml)"

          mkdir -p staging
          git clone --filter=blob:none "https://github.com/${upstream_repo}.git" staging/openai-codex
          git -C staging/openai-codex checkout --detach "${upstream_sha:-$upstream_base}"

          awk '
            /^name = / { name = $0; sub(/^name = "/, "", name); sub(/"$/, "", name) }
            /^enabled = true/ { enabled = 1 }
            /^file = / && enabled == 1 { file = $0; sub(/^file = "/, "", file); sub(/"$/, "", file); print name "\t" file; enabled = 0 }
          ' patches/manifest.toml | while IFS=$'\t' read -r patch_name patch_file; do
            echo "applying ${patch_name}: ${patch_file}"
            git -C staging/openai-codex apply --check "../../${patch_file}"
            git -C staging/openai-codex apply "../../${patch_file}"
          done

      - name: Use hermetic Cargo home for musl
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig for musl
        if: contains(matrix.target, 'linux-musl')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bash staging/openai-codex/.github/scripts/install-musl-build-tools.sh
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rustc UBSan wrapper for musl host tools
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/' || true)"
          fi

          wrapper="${RUNNER_TEMP}/rustc-ubsan-wrapper"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$@"
          EOF
          chmod 0755 "$wrapper"

          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - name: Clear sanitizer flags for musl
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_ENCODED_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "RUSTDOCFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"

          sanitize_flags() {
            local input="$1"
            input="${input//-fsanitize=undefined/}"
            input="${input//-fno-sanitize-recover=undefined/}"
            input="${input//-fno-sanitize-trap=undefined/}"
            echo "$input"
          }
          echo "CFLAGS=$(sanitize_flags "${CFLAGS-}")" >> "$GITHUB_ENV"
          echo "CXXFLAGS=$(sanitize_flags "${CXXFLAGS-}")" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(python3 staging/openai-codex/.github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)"
          release_tag="rusty-v8-v${version}"
          base_url="https://github.com/openai/codex/releases/download/${release_tag}"
          binding_dir="${RUNNER_TEMP}/rusty_v8"
          archive_path="${binding_dir}/librusty_v8_release_${TARGET}.a.gz"
          binding_path="${binding_dir}/src_binding_release_${TARGET}.rs"
          checksums_path="${binding_dir}/rusty_v8_release_${TARGET}.sha256"

          mkdir -p "${binding_dir}"
          curl -fsSL "${base_url}/librusty_v8_release_${TARGET}.a.gz" -o "${archive_path}"
          curl -fsSL "${base_url}/src_binding_release_${TARGET}.rs" -o "${binding_path}"
          curl -fsSL "${base_url}/rusty_v8_release_${TARGET}.sha256" -o "${checksums_path}"

          if [[ "$(wc -l < "${checksums_path}")" -ne 2 ]]; then
            echo "Expected exactly two checksums for ${TARGET} in ${checksums_path}" >&2
            exit 1
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            (cd "${binding_dir}" && sha256sum -c "${checksums_path}")
          else
            (cd "${binding_dir}" && shasum -a 256 -c "${checksums_path}")
          fi

          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: staging/openai-codex/codex-rs -> target
          key: ${{ matrix.target }}-${{ env.RELEASE_TAG }}

      - name: Build bwrap and export digest
        if: contains(matrix.target, 'linux')
        working-directory: staging/openai-codex/codex-rs
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" --bin bwrap
          bwrap_path="target/${TARGET}/release/bwrap"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Build release binaries
        working-directory: staging/openai-codex/codex-rs
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" --bin codex --bin codex-responses-api-proxy

      - name: Package artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package_dir="dist/${RELEASE_TAG}-${TARGET}"
          mkdir -p "$package_dir/bin" "$package_dir/codex-resources"
          printf '{}\n' > "$package_dir/codex-package.json"
          cp "staging/openai-codex/codex-rs/target/${TARGET}/release/codex" "$package_dir/bin/"
          cp "staging/openai-codex/codex-rs/target/${TARGET}/release/codex-responses-api-proxy" "$package_dir/bin/"
          chmod 0755 "$package_dir/bin/codex" "$package_dir/bin/codex-responses-api-proxy"
          if [[ -f "staging/openai-codex/codex-rs/target/${TARGET}/release/bwrap" ]]; then
            cp "staging/openai-codex/codex-rs/target/${TARGET}/release/bwrap" "$package_dir/codex-resources/bwrap"
            chmod 0755 "$package_dir/codex-resources/bwrap"
          fi
          cp README.md LICENSE NOTICE patches/manifest.toml "$package_dir/"

          archive="dist/${RELEASE_TAG}-${TARGET}.tar.gz"
          tar -C dist -czf "$archive" "${RELEASE_TAG}-${TARGET}"
          shasum -a 256 "$archive" > "${archive}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          path: |
            dist/${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
            dist/${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          upstream_repo="$(awk -F'"' '/^upstream_repo =/ { print $2; exit }' patches/manifest.toml)"
          upstream_base="$(awk -F'"' '/^upstream_base =/ { print $2; exit }' patches/manifest.toml)"
          upstream_sha="$(awk -F'"' '/^upstream_sha =/ { print $2; exit }' patches/manifest.toml)"

          {
            echo "# ${RELEASE_TAG}"
            echo
            echo "- Upstream: ${upstream_repo}@${upstream_base} (${upstream_sha})"
            echo "- Versioning: patch overlay release from \`patches/manifest.toml\`"
            echo "- Binaries: \`codex\`, \`codex-responses-api-proxy\`"
            echo
            echo "Enabled patches:"
            awk '
              /^name = / { name = $0; sub(/^name = "/, "", name); sub(/"$/, "", name) }
              /^enabled = true/ { print "- " name }
            ' patches/manifest.toml
            echo
            echo "Artifacts are built by GitHub Actions from the tagged manifest and include SHA-256 sidecar files."
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true

      - name: Read release metadata
        id: release-metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease="$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@v31
        if: steps.release-metadata.outputs.prerelease != 'true'

      - name: Move latest release ref
        if: steps.release-metadata.outputs.prerelease != 'true'
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command nu scripts/move-latest-release-ref.nu "${RELEASE_TAG}"
