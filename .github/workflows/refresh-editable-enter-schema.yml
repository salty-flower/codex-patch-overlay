name: refresh editable Enter schema

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-editable-enter-schema
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: cachix/install-nix-action@v31
      - name: Stage patched upstream
        run: |
          nix develop --command nu scripts/stage-upstream.nu
          nix develop --command nu scripts/apply-patches.nu
      - name: Generate schema payloads
        run: nix develop --command nu scripts/refresh-editable-enter-schema.nu
      - name: Commit generated payloads
        run: |
          if git diff --quiet -- patches/editable-enter-queue-app-server-exports-stable.json.zst patches/editable-enter-queue-app-server-exports-experimental.json.zst; then
            echo "Schema payloads are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/editable-enter-queue-app-server-exports-stable.json.zst patches/editable-enter-queue-app-server-exports-experimental.json.zst
          git commit -m "codex: refresh recall schema payloads"
          git pull --rebase origin main
          git push origin HEAD:main
